esphome:
  name: esp32-s3-matrix
  friendly_name: "ESP32-S3 LED Matrix"
  platformio_options:
    board_build.flash_mode: dio  # required for ESP32-S3

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:


# ––– Expose this device to Home Assistant
api:

# ─── LED Matrix ───────────────────────────────────────────────────────────────
# Waveshare ESP32-S3-Matrix: 8×8 WS2812B LEDs on GPIO14, 64 LEDs total.
# Color brightness capped at 40% to protect the power supply and eyes.
light:
  - platform: neopixelbus
    type: RGB
    variant: WS2811
    pin: GPIO14
    num_leds: 64
    name: "LED Matrix"
    id: led_matrix_light
    color_correct: [40%, 40%, 40%]

# ─── Display ──────────────────────────────────────────────────────────────────
# The physical matrix uses a serpentine column layout:
#   even columns run top→bottom, odd columns run bottom→top.
# pixel_mapper translates logical (x, y) to the physical LED index.
# The 180° rotation corrects for the board's default orientation.
display:
  - platform: addressable_light
    id: led_matrix_display
    addressable_light_id: led_matrix_light
    width: 8
    height: 8
    rotation: 180°
    update_interval: 100ms
    pixel_mapper: |-
      if (x % 2 == 0) {
        return (x * 8) + y;
      }
      return (x * 8) + (7 - y);
    lambda: |-
      // 8×8 bitmap: 1 = pixel on, 0 = pixel off
      // rows top→bottom, columns left→right
      const bool bitmap[8][8] = {
        {0, 0, 1, 1, 1, 1, 0, 0},  // row 0
        {0, 1, 0, 0, 0, 0, 1, 0},  // row 1
        {1, 0, 1, 0, 0, 1, 0, 1},  // row 2  ← eyes
        {1, 0, 0, 0, 0, 0, 0, 1},  // row 3
        {1, 0, 1, 0, 0, 1, 0, 1},  // row 4  ← mouth corners
        {1, 0, 0, 1, 1, 0, 0, 1},  // row 5  ← mouth middle
        {0, 1, 0, 0, 0, 0, 1, 0},  // row 6
        {0, 0, 1, 1, 1, 1, 0, 0},  // row 7
      };

      Color on_color  = Color(0xFF4500);  // orange — change to any RGB colour
      Color off_color = Color(0x000000);  // off

      for (int row = 0; row < 8; row++) {
        for (int col = 0; col < 8; col++) {
          it.draw_pixel_at(col, row, bitmap[row][col] ? on_color : off_color);
        }
      }
