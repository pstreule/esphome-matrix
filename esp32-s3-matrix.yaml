esphome:
  name: esp32-s3-matrix
  friendly_name: "ESP32-S3 LED Matrix"
  platformio_options:
    board_build.flash_mode: dio  # required for ESP32-S3

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:


# ––– Expose this device to Home Assistant
api:

# ─── LED Matrix ───────────────────────────────────────────────────────────────
# Waveshare ESP32-S3-Matrix: 8×8 WS2812B LEDs on GPIO14, 64 LEDs total.
# Color brightness capped at 40% to protect the power supply and eyes.
light:
  - platform: neopixelbus
    type: RGB
    variant: WS2811
    pin: GPIO14
    num_leds: 64
    name: "LED Matrix"
    id: led_matrix_light
    color_correct: [40%, 40%, 40%]

# Tracks the current horizontal scroll position of the text.
globals:
  - id: scroll_x
    type: int
    restore_value: no
    initial_value: '0'

# Font for rendering text.
font:
  - file: "MatrixChunky6.ttf"
    id: matrix_font
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'

# On/off switch exposed to Home Assistant. ALWAYS_ON => on at boot.
switch:
  - platform: template
    name: "Display"
    id: display_switch
    optimistic: true
    restore_mode: ALWAYS_ON

# Free-text input exposed to Home Assistant. Resetting scroll_x on change makes
# new text start scrolling in from the right edge.
text:
  - platform: template
    name: "Display Text"
    id: display_text
    optimistic: true
    mode: text
    min_length: 0
    max_length: 255
    initial_value: ""
    restore_value: true
    on_value:
      then:
        - globals.set:
            id: scroll_x
            value: '0'

# ─── Display ──────────────────────────────────────────────────────────────────
# The physical matrix uses a serpentine column layout:
#   even columns run top→bottom, odd columns run bottom→top.
# pixel_mapper translates logical (x, y) to the physical LED index.
# The 180° rotation corrects for the board's default orientation.
display:
  - platform: addressable_light
    id: led_matrix_display
    addressable_light_id: led_matrix_light
    width: 8
    height: 8
    rotation: 180°
    update_interval: 100ms
    auto_clear_enabled: true
#    pixel_mapper: |-
#      if (x % 2 == 0) {
#        return (x * 8) + y;
#      }
#      return (x * 8) + (7 - y);
    lambda: |-
      // Switch off → leave the display blank (auto_clear already cleared it).
      if (!id(display_switch).state) {
        return;
      }

      // No text set → blank.
      std::string txt = id(display_text).state;
      if (txt.empty()) {
        return;
      }

      Color text_color = Color(0xFF4500);  // orange — change to any RGB colour

      // Measure the rendered width so we know how far to scroll.
      int x1, y1, w, h;
      it.get_text_bounds(0, 0, txt.c_str(), id(matrix_font),
                         TextAlign::TOP_LEFT, &x1, &y1, &w, &h);

      // Start off the right edge (x = 8) and move left as scroll_x grows.
      int x = 8 - id(scroll_x);
      it.print(x, 0, id(matrix_font), text_color, TextAlign::TOP_LEFT, txt.c_str());

      // Advance 1px per render (~100ms); loop once fully scrolled off the left.
      id(scroll_x) += 1;
      if (id(scroll_x) > w + 8) {
        id(scroll_x) = 0;
      }
